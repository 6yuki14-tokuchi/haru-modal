name: Deploy Haru to Modal (free credits only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: haru-modal-deploy
  cancel-in-progress: false
jobs:
  prepare:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      receipt: ${{ steps.authorize.outputs.receipt }}
    env:
      HARU_PASSWORD: ${{ secrets.HARU_PASSWORD }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install modal==1.6.4
      - name: Prepare encrypted one-hour authorization
        id: authorize
        run: |
          python - <<'PYAUTH'
          import asyncio, json, os, subprocess
          from modal.client import _Client
          from modal.config import config
          from modal.token_flow import _TokenFlow
          async def main():
              assert len(os.environ["HARU_PASSWORD"]) >= 32
              async with _Client.anonymous(config.get("server_url")) as client:
                  flow = _TokenFlow(client)
                  async with flow.start(expires_in_seconds=3600) as (_, url, code):
                      data = json.dumps({"flow_id": flow.token_flow_id,
                          "wait_secret": flow.wait_secret, "url": url, "code": code}).encode()
                      cipher = subprocess.run(["openssl", "enc", "-aes-256-cbc", "-pbkdf2",
                          "-iter", "100000", "-salt", "-a", "-A", "-pass", "env:HARU_PASSWORD"],
                          input=data, capture_output=True, check=True).stdout.decode()
                      with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                          out.write("receipt=" + cipher + "\n")
                      print("::notice title=Encrypted Modal authorization::" + cipher)
          asyncio.run(main())
          PYAUTH
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MODAL_ENVIRONMENT: main
      HARU_PASSWORD: ${{ secrets.HARU_PASSWORD }}
      MODAL_AUTH_RECEIPT: ${{ needs.prepare.outputs.receipt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python and authentication behavior
        run: |
          python -m unittest -v test_auth
          python -m py_compile modal_app.py protected_haru.py cloud_smoke.py
          test -n "$HARU_PASSWORD"
      - name: Install deployment client on cloud runner only
        run: python -m pip install modal==1.6.4
      - name: Wait for authorized one-hour yuki14 connection
        run: |
          python - <<'PYAUTH'
          import asyncio, json, os, subprocess
          from modal.client import _Client
          from modal.config import config
          from modal.token_flow import _TokenFlow
          data = subprocess.run(["openssl", "enc", "-d", "-aes-256-cbc", "-pbkdf2",
              "-iter", "100000", "-a", "-A", "-pass", "env:HARU_PASSWORD"],
              input=os.environ["MODAL_AUTH_RECEIPT"].encode(), capture_output=True, check=True).stdout
          receipt = json.loads(data)
          async def main():
              async with _Client.anonymous(config.get("server_url")) as client:
                  flow = _TokenFlow(client)
                  flow.token_flow_id = receipt["flow_id"]
                  flow.wait_secret = receipt["wait_secret"]
                  for _ in range(18):
                      result = await flow.finish()
                      if result is None:
                          continue
                      if result.workspace_username != "yuki14":
                          raise RuntimeError("Unexpected Modal workspace; refusing deployment")
                      print("::add-mask::" + result.token_id)
                      print("::add-mask::" + result.token_secret)
                      with open(os.environ["GITHUB_ENV"], "a") as out:
                          out.write("MODAL_TOKEN_ID=" + result.token_id + "\n")
                          out.write("MODAL_TOKEN_SECRET=" + result.token_secret + "\n")
                      print("Authorized one-hour yuki14 connection is ready.")
                      return
                  raise TimeoutError("No authorized Modal connection received")
          asyncio.run(main())
          PYAUTH
      - name: Deploy Japanese Haru
        run: modal deploy modal_app.py
      - name: Exercise Japanese speech on cloud runner only
        timeout-minutes: 22
        env:
          HARU_URL: https://yuki14--haru-ja-free-web.us-east.modal.run
          HARU_TEST_REFERENCE: ${{ secrets.HARU_TEST_REFERENCE }}
          HARU_TEST_CHAT: ${{ secrets.HARU_TEST_CHAT }}
          HARU_TEST_GROUNDING: ${{ secrets.HARU_TEST_GROUNDING }}
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          python -m pip install numpy
          HARU_CASE=short_chat python -u cloud_smoke.py
          HARU_CASE=grounding python -u cloud_smoke.py
