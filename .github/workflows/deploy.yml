name: Deploy Haru to Modal (free credits only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: haru-modal-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MODAL_ENVIRONMENT: main
      HARU_PASSWORD: ${{ secrets.HARU_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python and authentication behavior
        run: |
          python -m unittest -v test_auth
          python -m py_compile modal_app.py protected_haru.py
          test -n "$HARU_PASSWORD"
      - name: Install deployment client on cloud runner only
        run: python -m pip install modal==1.6.4
      - name: Start temporary Modal authorization
        env:
          NO_COLOR: '1'
          COLUMNS: '300'
          BROWSER: 'false'
        shell: bash
        run: |
          nohup modal token new --expires-in 1h > "$RUNNER_TEMP/modal-auth.log" 2>&1 < /dev/null &
          echo "MODAL_AUTH_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            if grep -q 'https://modal.com/' "$RUNNER_TEMP/modal-auth.log"; then
              python - <<'PYAUTH'
          import os, re
          text = open(os.environ["RUNNER_TEMP"] + "/modal-auth.log").read()
          text = re.sub(r"\x1b\[[0-9;]*m", "", text)
          for line in text.splitlines():
              if "https://modal.com/" in line or "Enter this code:" in line:
                  print("::notice title=Modal temporary authorization::" + line.strip())
          PYAUTH
              exit 0
            fi
            sleep 1
          done
          echo "No authorization URL received" >&2
          exit 1
      - name: Wait for authorized yuki14 connection
        shell: bash
        run: |
          for i in $(seq 1 240); do
            if test -f "$HOME/.modal.toml"; then
              if grep -q 'yuki14 workspace' "$RUNNER_TEMP/modal-auth.log"; then
                echo "Authorized temporary yuki14 connection is ready."
                exit 0
              fi
              echo "Unexpected Modal workspace; refusing deployment" >&2
              exit 1
            fi
            if ! kill -0 "$MODAL_AUTH_PID" 2>/dev/null; then
              echo "Modal authorization process exited before credential setup" >&2
              exit 1
            fi
            sleep 2
          done
          echo "Modal authorization timed out" >&2
          exit 1
      - name: Deploy Japanese Haru
        run: modal deploy modal_app.py
      - name: Remove runner credentials
        if: always()
        shell: bash
        run: rm -f "$HOME/.modal.toml"
